<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pikxyzz</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #000;
    --paper: #fffdf5;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Space Grotesk', Arial, sans-serif;
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px 16px;
    background: #000;
    overflow-x: hidden;
    position: relative;
  }

  /* ===== BACKGROUND VIDEO ===== */
  .bg-video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
    pointer-events: none;
    filter: saturate(1.2) contrast(1.05);
  }
  .bg-tint {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background-image: radial-gradient(rgba(0,0,0,.55) 1px, transparent 1px);
    background-size: 22px 22px;
  }

  /* ===== CARD ===== */
  .card {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 420px;
    background: var(--paper);
    border: 4px solid var(--ink);
    box-shadow: 10px 10px 0 var(--ink);
    padding: 28px 22px 22px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  /* ===== AVATAR (bisa di-drag) ===== */
  .avatar-wrap {
    width: 110px;
    height: 110px;
    margin-top: 10px;
    position: relative;
    touch-action: none;
  }
  .avatar {
    width: 100%;
    height: 100%;
    border: 4px solid var(--ink);
    box-shadow: 6px 6px 0 var(--ink);
    object-fit: cover;
    cursor: grab;
    background: #ddd;
    user-select: none;
    -webkit-user-drag: none;
    transition: box-shadow .1s ease;
  }
  .avatar.dragging {
    cursor: grabbing;
    box-shadow: 12px 12px 0 var(--ink);
  }
  .avatar-wrap .hint {
    position: absolute;
    bottom: -26px;
    left: 50%;
    transform: translateX(-50%);
    font-size: .7rem;
    font-weight: 700;
    white-space: nowrap;
    opacity: .6;
    pointer-events: none;
  }

  /* ===== NAMA ===== */
  .nama {
    font-family: 'Archivo Black', sans-serif;
    font-size: 1.6rem;
    text-transform: uppercase;
    background: #ff90e8;
    border: 3px solid var(--ink);
    box-shadow: 4px 4px 0 var(--ink);
    padding: 2px 14px;
    transform: rotate(-2deg);
    display: flex;
    align-items: center;
    gap: 8px;
    transition: transform .2s ease;
  }
  .nama:hover { transform: rotate(2deg) scale(1.04); }

  .verified {
    background: #00e5ff;
    border: 2px solid var(--ink);
    border-radius: 50%;
    width: 22px;
    height: 22px;
    display: inline-grid;
    place-items: center;
    font-size: .65rem;
  }

  /* ===== TAG ANIMASI ===== */
  .tag {
    background: #fff;
    border: 3px solid var(--ink);
    box-shadow: 3px 3px 0 var(--ink);
    padding: 6px 12px;
    font-weight: 700;
    font-size: .85rem;
    letter-spacing: 1px;
    min-height: 34px;
    min-width: 150px;
    text-align: center;
  }
  .tag::after {
    content: '|';
    margin-left: 2px;
    animation: blink .8s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ===== BUTTON ===== */
  .btn {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border: 3px solid var(--ink);
    box-shadow: 5px 5px 0 var(--ink);
    background: var(--c);
    color: var(--ink);
    text-decoration: none;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    transition: transform .1s ease, box-shadow .1s ease;
  }
  .btn:hover {
    transform: translate(-2px, -2px);
    box-shadow: 7px 7px 0 var(--ink);
  }
  .btn:active {
    transform: translate(5px, 5px);
    box-shadow: 0 0 0 var(--ink);
  }
  .btn:focus-visible {
    outline: 3px dashed var(--ink);
    outline-offset: 4px;
  }
  .btn .ic {
    width: 38px;
    height: 38px;
    background: var(--ink);
    color: #fff;
    display: grid;
    place-items: center;
    font-size: 1.1rem;
    flex-shrink: 0;
    transition: transform .2s ease;
  }
  .btn:hover .ic { transform: rotate(-12deg) scale(1.1); }
  .btn .label { flex: 1; }
  .btn .arrow {
    font-family: 'Archivo Black', sans-serif;
    transition: transform .15s ease;
  }
  .btn:hover .arrow { transform: translateX(4px); }

  .tiktok    { --c: #ff90e8; }
  .instagram { --c: #ffc857; }
  .github    { --c: #c4b5fd; }
  .whatsapp  { --c: #86efac; }
  .telegram  { --c: #7dd3fc; }

  /* ===== FOOTER ===== */
  .footer {
    margin-top: 6px;
    background: var(--ink);
    color: #fff;
    font-size: .75rem;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 4px 10px;
  }

  /* ===== TOAST ===== */
  .toast {
    position: fixed;
    z-index: 3;
    left: 50%;
    bottom: 24px;
    transform: translate(-50%, 140%);
    background: #fff;
    border: 3px solid var(--ink);
    box-shadow: 5px 5px 0 var(--ink);
    padding: 10px 16px;
    font-weight: 700;
    transition: transform .25s cubic-bezier(.2,.9,.3,1.2);
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show { transform: translate(-50%, 0); }

  @media (max-width: 480px) {
    .avatar-wrap { width: 90px; height: 90px; }
    .nama { font-size: 1.3rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<video class="bg-video" id="bgVideo" autoplay loop muted playsinline>
  <source src="bg.mp4" type="video/mp4">
</video>
<div class="bg-tint"></div>

<audio id="bgm" loop>
  <source src="audio.mp3" type="audio/mpeg">
</audio>

<div class="card" id="card">
  <div class="avatar-wrap">
    <img class="avatar" id="avatar" src="foto.jpg" alt="Pikxyzz" draggable="false" />
    <span class="hint">tarik fotonya!</span>
  </div>

  <div class="nama">
    Pikxyzz <span class="verified"><i class="fas fa-check"></i></span>
  </div>

  <div class="tag" id="typing-text"></div>

  <a href="https://tiktok.com/@.pikxyz" class="btn tiktok" target="_blank" rel="noopener" data-name="TikTok">
    <span class="ic"><i class="fab fa-tiktok"></i></span>
    <span class="label">TikTok</span>
    <span class="arrow">›</span>
  </a>

  <a href="https://instagram.com/piky_ajaaaaaa" class="btn instagram" target="_blank" rel="noopener" data-name="Instagram">
    <span class="ic"><i class="fab fa-instagram"></i></span>

  <a href="https://github.com/Piky-Adalah-mahluk-sempurna-ZXXXXX/PIKY-MAHLUK-SEMPURNA-XXXXXXX" class="btn github" target="_blank" rel="noopener" data-name="GitHub">
    <span class="ic"><i class="fab fa-github"></i></span>
    <span class="label">GitHub</span>
    <span class="arrow">›</span>
  </a>

  <a href="https://wa.me/6289669880306" class="btn whatsapp" target="_blank" rel="noopener" data-name="WhatsApp">
    <span class="ic"><i class="fab fa-whatsapp"></i></span>
    <span class="label">WhatsApp</span>
    <span class="arrow">›</span>
  </a>

  <a href="https://t.me/Pikxyzz" class="btn telegram" target="_blank" rel="noopener" data-name="Telegram">
    <span class="ic"><i class="fab fa-telegram-plane"></i></span>
    <span class="label">Telegram</span>
    <span class="arrow">›</span>
  </a>

  <div class="footer">PIKXYZZ © 2026</div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ===== Musik: nyala pas user klik/sentuh di mana aja =====
  const audio = document.getElementById('bgm');
  const bgVideo = document.getElementById('bgVideo');
  audio.volume = 0.5;
  let musicStarted = false;

  function startMusic() {
    if (musicStarted) return;
    audio.play().then(() => { musicStarted = true; }).catch(() => {});
  }
  audio.play().then(() => { musicStarted = true; }).catch(() => {});
  document.addEventListener('click', startMusic);
  document.addEventListener('touchstart', startMusic, { passive: true });

  // Video background jalan terus, tapi kalau gagal dimuat tidak ganggu halaman
  bgVideo.play().catch(() => {});

  // ===== Avatar bisa di-drag (mouse & sentuh) =====
  const avatar = document.getElementById('avatar');
  let dragging = false;
  let startX = 0, startY = 0;
  let offX = 0, offY = 0;
  let vx = 0, vy = 0;
  let lastX = 0, lastY = 0, lastT = 0;
  let rafId = null;

  function applyTransform() {
    avatar.style.transform = `translate(${offX}px, ${offY}px) rotate(${offX / 6}deg)`;
  }

  function onDown(e) {
    dragging = true;
    avatar.classList.add('dragging');
    const p = e.touches ? e.touches[0] : e;
    startX = p.clientX - offX;
    startY = p.clientY - offY;
    lastX = p.clientX; lastY = p.clientY; lastT = performance.now();
    cancelAnimationFrame(rafId);
    e.preventDefault();
  }

  function onMove(e) {
    if (!dragging) return;
    const p = e.touches ? e.touches[0] : e;
    offX = p.clientX - startX;
    offY = p.clientY - startY;
    const now = performance.now();
    const dt = Math.max(now - lastT, 1);
    vx = (p.clientX - lastX) / dt * 16;
    vy = (p.clientY - lastY) / dt * 16;
    lastX = p.clientX; lastY = p.clientY; lastT = now;
    applyTransform();
  }

  function onUp() {
    if (!dragging) return;
    dragging = false;
    avatar.classList.remove('dragging');
    (function fling() {
      vx *= 0.9; vy *= 0.9;
      offX += vx; offY += vy;
      offX *= 0.97; offY *= 0.97;
      applyTransform();
      if (Math.abs(vx) > 0.2 || Math.abs(vy) > 0.2 || Math.abs(offX) > 0.5 || Math.abs(offY) > 0.5) {
        rafId = requestAnimationFrame(fling);
      } else {
        offX = 0; offY = 0; applyTransform();
      }
    })();
  }

  avatar.addEventListener('mousedown', onDown);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  avatar.addEventListener('touchstart', onDown, { passive: false });
  window.addEventListener('touchmove', onMove, { passive: true });
  window.addEventListener('touchend', onUp);

  // ===== Toast saat klik link =====
  const toast = document.getElementById('toast');
  let toastTimer;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1600);
  }
  document.querySelectorAll('.btn').forEach(btn => {
    btn.addEventListener('click', () => {
      showToast('Membuka ' + btn.dataset.name + '...');
    });
  });

  // ===== Typing text =====
  const phrases = ['CONTACT ME', 'LINK DI BAWAH 👇', 'PIKY GANZ'];
  const tagEl = document.getElementById('typing-text');
  let p = 0, i = 0, deleting = false;

  function typeLoop() {
    const word = phrases[p];
    if (!deleting) {
      tagEl.textContent = word.slice(0, ++i);
      if (i === word.length) {
        deleting = true;
        return setTimeout(typeLoop, 1500);
      }
    } else {
      tagEl.textContent = word.slice(0, --i);
      if (i === 0) {
        deleting = false;
        p = (p + 1) % phrases.length;
      }
    }
    setTimeout(typeLoop, deleting ? 50 : 100);
  }
  typeLoop();
</script>
</body>
</html>
